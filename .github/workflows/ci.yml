name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel superseded runs on the same ref to keep feedback fast.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- Static analysis -------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # ---- Tests -----------------------------------------------------------
      # Unit tests need no services. Integration tests arrive with TASK 002 and
      # will add an ephemeral Postgres service plus the Firebase Auth Emulator
      # (docs/ARCHITECTURE.md §13.1).
      - name: Unit tests
        run: pnpm test

      # ---- Build -----------------------------------------------------------
      - name: Production build
        run: pnpm build
        env:
          APP_ENV: preview

      # Verifies the app compiles for the Cloudflare Workers target, which can
      # fail even when `next build` succeeds (bundling and runtime constraints).
      - name: Cloudflare Workers build
        run: pnpm cf:build
        env:
          APP_ENV: preview

  guardrails:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocks a merge if a real .env or a credential-shaped file is committed.
      - name: Check for committed secrets
        run: bash scripts/check-secrets.sh

      - name: Dependency audit
        run: pnpm audit --audit-level high
        continue-on-error: true

  e2e:
    name: Playwright E2E (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Production build
        run: pnpm build
        env:
          APP_ENV: preview

      # Runs both the desktop and mobile projects against the built app. The
      # script starts the server, waits for readiness and shuts it down, so no
      # process is left behind.
      #
      # Authenticated journeys are NOT covered yet: they need the Firebase Auth
      # Emulator (docs/ARCHITECTURE.md §13.1), which arrives with TASK 003.
      - name: E2E
        run: bash scripts/run-e2e.sh 3200

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
